[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "install", "log"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["ament_index_python", "launch", "launch_ros"]
